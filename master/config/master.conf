# Master agent runtime defaults
# Edit here

default_gateway cn1
default_partition test

# Job deadline and wait (seconds)
default_deadline 1800
wait_slack 30

# SSH timeouts (seconds)
submit_timeout 30
# One-shot poll.sh SSH bound only; poll-wait.sh does not use this.
poll_timeout 15
ssh_connect_timeout 15
ssh_server_alive_interval 30
ssh_server_alive_count_max 3

# Remote paths on slave gateways.
# deploy-slave.sh syncs the whole slave/ tree here (submit.sh / poll-wait.sh use the same key).
remote_project /home/cn1/agents
remote_run_slave scripts/run-slave.sh
